name: Decode binary assets
on:
  push:
    paths: ["icons-bundle.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack icons-bundle.b64 (base64 tar.gz of the PNG/ICO icons)
        run: |
          set -e
          base64 -d icons-bundle.b64 | tar xzf -
          git rm -q icons-bundle.b64
          ls -la icons apple-touch-icon.png favicon.ico
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Unpack icons" && git push
