<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6EC" id="meta-theme-color">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ember">
  <meta name="application-name" content="Ember">
  <meta name="description" content="Build streaks for any habit or task. A warm, simple streak tracker.">
  <meta name="format-detection" content="telephone=no">
  <title>Ember — Streak Builder</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div id="onboarding" class="screen" hidden></div>

    <div id="main" class="screen" hidden>
      <header class="app-header" id="app-header"></header>
      <main id="view" class="view"></main>
      <nav class="tabbar" id="tabbar" aria-label="Main">
        <button class="tab" data-tab="today" aria-label="Today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2c.4 0 .7.15 1.02.44l7.1 6.4c.5.45.2 1.26-.52 1.26H18v7.1c0 .9-.7 1.6-1.6 1.6h-2.7c-.5 0-.9-.4-.9-.9v-3.4c0-.5-.4-.9-.9-.9h-1.8c-.5 0-.9.4-.9.9v3.4c0 .5-.4.9-.9.9H7.6c-.9 0-1.6-.7-1.6-1.6v-7.1H4.4c-.72 0-1.02-.81-.52-1.26l7.1-6.4c.32-.29.62-.44 1.02-.44z"/></svg>
          <span>Today</span>
        </button>
        <button class="tab" data-tab="habits" aria-label="Habits">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6.5A1.5 1.5 0 1 1 7 3.5a1.5 1.5 0 0 1 0 3zm3.2-2.2h10.3c.6 0 1 .4 1 1s-.4 1-1 1H10.2c-.6 0-1-.4-1-1s.4-1 1-1zM7 13.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.2-2.2h10.3c.6 0 1 .4 1 1s-.4 1-1 1H10.2c-.6 0-1-.4-1-1s.4-1 1-1zM7 20.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.2-2.2h10.3c.6 0 1 .4 1 1s-.4 1-1 1H10.2c-.6 0-1-.4-1-1s.4-1 1-1z"/></svg>
          <span>Habits</span>
        </button>
        <button class="tab" data-tab="stats" aria-label="Stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.2V9.6c0-.6.4-1 1-1h1.6c.6 0 1 .4 1 1v9.6c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1zm5.2 0V4.8c0-.6.4-1 1-1h1.6c.6 0 1 .4 1 1v14.4c0 .6-.4 1-1 1h-1.6c-.6 0-1-.4-1-1zm5.2 0v-6.4c0-.6.4-1 1-1H18c.6 0 1 .4 1 1v6.4c0 .6-.4 1-1 1h-1.6c-.6 0-1-.4-1-1z"/></svg>
          <span>Stats</span>
        </button>
        <button class="tab" data-tab="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13.1c.04-.36.06-.73.06-1.1s-.02-.74-.06-1.1l2.05-1.6c.2-.15.25-.42.12-.64l-1.94-3.36a.5.5 0 0 0-.61-.22l-2.42.97a8.3 8.3 0 0 0-1.9-1.1l-.36-2.57A.5.5 0 0 0 13.84 2h-3.88a.5.5 0 0 0-.49.42L9.11 5a8.3 8.3 0 0 0-1.9 1.1l-2.42-.97a.5.5 0 0 0-.61.22L2.24 8.7a.5.5 0 0 0 .12.64L4.4 10.9c-.04.36-.06.73-.06 1.1s.02.74.06 1.1L2.36 14.7a.5.5 0 0 0-.12.64l1.94 3.36c.13.22.4.3.61.22l2.42-.97a8.3 8.3 0 0 0 1.9 1.1l.36 2.57a.5.5 0 0 0 .49.42h3.88a.5.5 0 0 0 .49-.42l.36-2.57a8.3 8.3 0 0 0 1.9-1.1l2.42.97c.22.09.48 0 .61-.22l1.94-3.36a.5.5 0 0 0-.12-.64l-2.05-1.6zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <div id="sheet-root"></div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
